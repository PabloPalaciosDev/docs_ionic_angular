<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ionic Docs — Referencia rápida</title>
  <meta name="description" content="Referencia rápida de Ionic + Angular + Capacitor">
  <link rel="stylesheet" href="styles.css">
  <!-- Loaded in <head> without defer so the theme is applied before first paint (no inline script → CSP friendly) -->
  <script src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="topbar">
    <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Mostrar/ocultar menú" aria-controls="sidebar" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Inicio">
      <span class="brand-logo" aria-hidden="true">⚡</span>
      <span class="brand-text">Ionic<span class="brand-dim"> · Angular · Capacitor</span></span>
    </a>
    <button class="search-trigger" id="searchOpen" type="button" aria-label="Buscar (Ctrl+K)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="search-trigger-text">Buscar…</span>
      <kbd>Ctrl K</kbd>
    </button>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Cambiar tema claro/oscuro">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Secciones">
      <div class="sidebar-inner" id="sidebarNav"></div>
    </nav>
    <div class="backdrop" id="backdrop" hidden></div>

    <main class="content" id="main" tabindex="-1">
      <noscript><p class="noscript">Este sitio necesita JavaScript para renderizar el contenido.</p></noscript>
    </main>
  </div>

  <div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Buscador" hidden>
    <div class="search-box">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Buscar temas, componentes, plugins, comandos…" autocomplete="off" spellcheck="false" aria-controls="searchResults">
        <kbd>Esc</kbd>
      </div>
      <ul class="search-results" id="searchResults" role="listbox"></ul>
      <div class="search-footer"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
